name: ci
on: [push, pull_request]
# Read-only token for every job (OpenSSF Scorecard Token-Permissions; no job writes to the repository)
permissions:
  contents: read
# a new push to a ci-prova-* branch cancels the superseded run of that branch (the account's runners are shared)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/ci-prova-') }}
jobs:
  test:
    # the WHOLE suite on every system x every declared Python x every optional-dependency set (Roberto, 24/11/2026):
    # full = [sign,schema] + the cryptovalid wheel (interop runs); sign = cryptography only (schema/interop skip);
    # none = no optional dependency (signing/seal/tip skip) - a regression in a fallback path goes red on the system it breaks.
    # macOS arm64 and Windows: setup-python's "3.9" is 3.9.13, the last 3.9 build published for them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        extras: [full, sign, none]
    runs-on: ${{ (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.9') && 'ubuntu-24.04' || matrix.os }}   # 3.9 has no build for ubuntu-26.04 (ubuntu-latest from 2026-10-19)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (full) - signing + schema extras + the cryptovalid verifier (same author, separate implementation) for the interop test
        if: matrix.extras == 'full'
        run: |
          python -m pip install ".[sign,schema]"
          python -m pip install https://github.com/robertolocatelli81-dev/cryptovalid-opencore/releases/download/v0.15.0/cryptovalid_opencore-0.15.0-py3-none-any.whl
      - name: Install (sign) - cryptography only; jsonschema must be absent
        if: matrix.extras == 'sign'
        run: |
          python -m pip install ".[sign]"
          if python -c "import jsonschema" 2>/dev/null; then echo "jsonschema must not be installed here"; exit 1; fi
      - name: Install (none) - the package with no extra; cryptography and jsonschema must be absent
        if: matrix.extras == 'none'
        run: |
          python -m pip install .
          if python -c "import cryptography" 2>/dev/null; then echo "cryptography must not be installed here"; exit 1; fi
          if python -c "import jsonschema" 2>/dev/null; then echo "jsonschema must not be installed here"; exit 1; fi
      - name: "macOS: a full volume, the equivalent of Linux's /dev/full (writes there fail with ENOSPC)"
        if: runner.os == 'macOS'
        run: |
          hdiutil create -size 4m -fs HFS+ -volname crafull "$RUNNER_TEMP/full.dmg"
          hdiutil attach "$RUNNER_TEMP/full.dmg"
          : > /Volumes/crafull/sink
          python -c "import sys; sys.path.insert(0, 'tests'); import _streams as S; S.fill_volume('/Volumes/crafull')"
          if printf x > /Volumes/crafull/probe; then echo "the volume is not full"; exit 1; fi
          echo "CRA_FULL_DIR=/Volumes/crafull" >> "$GITHUB_ENV"
      # 512-byte clusters: a file there grows only into the slack of its last cluster (under 512 bytes, less than any
      # ledger line), so "full" means full for an existing file too (16 MB FAT with larger clusters let a ledger line in)
      - name: "Windows: a full volume, the equivalent of /dev/full and of a file size limit (writes there fail with ENOSPC)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = Join-Path $env:RUNNER_TEMP "full.vhdx"
          $s = Join-Path $env:RUNNER_TEMP "full.txt"
          Set-Content $s "create vdisk file=`"$v`" maximum=16 type=fixed`r`nselect vdisk file=`"$v`"`r`nattach vdisk`r`ncreate partition primary`r`nformat fs=fat quick label=CRAFULL unit=512`r`nassign letter=Q"
          diskpart /s $s
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path Q:\)) { throw "the full volume was not made (diskpart exit $LASTEXITCODE)" }
          New-Item -ItemType File Q:\sink | Out-Null
          python -c "import sys; sys.path.insert(0, 'tests'); import _streams as S; S.fill_volume('Q:\\')"
          $full = $false
          try { [IO.File]::WriteAllBytes("Q:\probe", [byte[]](1)) } catch [IO.IOException] { $full = $true }
          if (-not $full) { throw "the volume is not full: a 1-byte file was written" }
          "CRA_FULL_DIR=Q:\" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Windows has no IANA time-zone database of its own; Python reads the tzdata package (a test need, not an extra)
        if: runner.os == 'Windows'
        run: python -m pip install tzdata
      - name: The tools the suite calls, as found on this runner
        run: |
          which openssl node bash || true
          openssl version || true
          node --version || true
      - name: Unit tests (every suite)
        run: |
          set -o pipefail            # round 9: without it `tee` hid unittest's exit code - this job could not go red
          python -B -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/ut.log"   # outside the tree (tree hygiene reads it)
          python - <<'PY'
          # round 7: a `__main__` block above a class hid two tests from the per-file loop - every test class in every file must have run,
          # and the suite must have ended OK (a FAIL line also names the class)
          import ast, glob, os, re
          ran = open(os.path.join(os.environ["RUNNER_TEMP"], "ut.log"), encoding="utf-8", errors="replace").read()
          assert re.search(r"^OK( \(skipped=\d+\))?\r?$", ran, re.M), "unittest did not end with OK"
          seen = lambda cls: re.search(r"\." + re.escape(cls) + r"[.)]", ran) is not None   # 3.9: "(mod.Class)"; 3.11+: "(mod.Class.test)"
          assert not seen("NoSuchTestClassXYZ"), "positive control: a fake class name must not match"
          for f in glob.glob("tests/test_*.py"):
              for node in ast.parse(open(f, encoding="utf-8").read()).body:
                  if isinstance(node, ast.ClassDef) and any(isinstance(b, ast.Attribute) and b.attr == "TestCase" for b in node.bases) \
                          and any(isinstance(m, ast.FunctionDef) and m.name.startswith("test") for m in node.body):
                      assert seen(node.name), f"{f}:{node.name} did not run"   # 18/11/2026: a base class with no test of its own runs nothing
          print("every TestCase class ran")
          PY
      - name: Gate - a tampered pack MUST fail, an intact one MUST pass (exit codes)
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, tempfile
          d = tempfile.mkdtemp(); led = os.path.join(d, "l.jsonl"); pack = os.path.join(d, "p.json")
          base = [sys.executable, "-m", "omega_cra_evol.cli"]
          c = base + ["sbom", "--ledger", led, "--product", "p", "--version", "1", "--installed", "pip"]
          assert subprocess.run(c).returncode == 0
          assert subprocess.run(base + ["pack", "--ledger", led, "--product", "p", "--version", "1", "--out", pack]).returncode == 0
          assert subprocess.run(base + ["verify", pack]).returncode == 0, "intact pack must PASS"
          p = json.load(open(pack)); p["product_id"] = "x"; json.dump(p, open(pack, "w"))
          assert subprocess.run(base + ["verify", pack]).returncode != 0, "tampered pack must FAIL"
          print("gate ok")
          PY
      - name: Both commands are installed and print the package version; the earlier import name still works and warns
        run: |
          v=$(python -c "import omega_cra_evol; print(omega_cra_evol.__version__)")
          test "$(cra --version | tr -d '\r')" = "omega-cra-evol $v"
          test "$(omega-cra-evol --version | tr -d '\r')" = "omega-cra-evol $v"
          if python -W error::DeprecationWarning -c "import cra_evidence" 2>/dev/null; then echo "positive control: import cra_evidence must warn"; exit 1; fi
          python -W ignore::DeprecationWarning -c "import cra_evidence, omega_cra_evol; assert cra_evidence.EvidenceLocker is omega_cra_evol.EvidenceLocker"
          echo "commands and alias ok"
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - name: gitleaks (whole history, pinned binary — the action fails on a root commit's parent)
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          # sha256 = gitleaks_8.24.3_checksums.txt of the release (compared on 15/11/2026)
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks && ./gitleaks git . --redact --exit-code 1
  verifiers:
    # the four verifiers on the three systems: Go, Rust and Node toolchains exist for each; the official CycloneDX CLI
    # publishes a binary for each (sha256 from the release's asset digests; the Linux one also measured on 15/11/2026)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.12"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: {node-version: "22"}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: {go-version: "1.24"}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: "macOS: a full volume, the equivalent of Linux's /dev/full (writes there fail with ENOSPC)"
        if: runner.os == 'macOS'
        run: |
          hdiutil create -size 4m -fs HFS+ -volname crafull "$RUNNER_TEMP/full.dmg"
          hdiutil attach "$RUNNER_TEMP/full.dmg"
          : > /Volumes/crafull/sink
          python -c "import sys; sys.path.insert(0, 'tests'); import _streams as S; S.fill_volume('/Volumes/crafull')"
          if printf x > /Volumes/crafull/probe; then echo "the volume is not full"; exit 1; fi
          echo "CRA_FULL_DIR=/Volumes/crafull" >> "$GITHUB_ENV"
      # 512-byte clusters: a file there grows only into the slack of its last cluster (under 512 bytes, less than any
      # ledger line), so "full" means full for an existing file too (16 MB FAT with larger clusters let a ledger line in)
      - name: "Windows: a full volume, the equivalent of /dev/full and of a file size limit (writes there fail with ENOSPC)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = Join-Path $env:RUNNER_TEMP "full.vhdx"
          $s = Join-Path $env:RUNNER_TEMP "full.txt"
          Set-Content $s "create vdisk file=`"$v`" maximum=16 type=fixed`r`nselect vdisk file=`"$v`"`r`nattach vdisk`r`ncreate partition primary`r`nformat fs=fat quick label=CRAFULL unit=512`r`nassign letter=Q"
          diskpart /s $s
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path Q:\)) { throw "the full volume was not made (diskpart exit $LASTEXITCODE)" }
          New-Item -ItemType File Q:\sink | Out-Null
          python -c "import sys; sys.path.insert(0, 'tests'); import _streams as S; S.fill_volume('Q:\\')"
          $full = $false
          try { [IO.File]::WriteAllBytes("Q:\probe", [byte[]](1)) } catch [IO.IOException] { $full = $true }
          if (-not $full) { throw "the volume is not full: a 1-byte file was written" }
          "CRA_FULL_DIR=Q:\" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build the verifiers in other languages (Go std-only; Rust with ed25519-dalek)
        run: |
          python -m pip install ".[sign]"
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=".exe"
          (cd verifiers/go && go vet ./... && go build -o "$RUNNER_TEMP/cra-verify-go$exe" .)
          (cd verifiers/rust && cargo build --release --locked)   # Cargo.lock in the repository: the same crate versions every run
          echo "CRA_VERIFY_GO=$RUNNER_TEMP/cra-verify-go$exe" >> "$GITHUB_ENV"
          echo "CRA_VERIFY_RUST=$GITHUB_WORKSPACE/verifiers/rust/target/release/cra-verify$exe" >> "$GITHUB_ENV"
      - name: Differential oracle — Python / JS / Go / Rust must agree on every fixture AND on the failing layers (absence = failure)
        run: python verifiers/differential.py --require js,go,rust
      - name: A receipt that could not be written exits 74 — Python CLI, JS, Go and Rust (real processes on a full device and a closed pipe)
        run: python -B -m unittest discover -s tests -p 'test_receipt_not_written_20261012.py' -v
      - name: The receipt whole or exit 74 — unbuffered Python, a full non-blocking stdout waited for, stdout read-only, usage with stderr lost (Python CLI, JS, Go and Rust; real processes)
        run: python -B -m unittest discover -s tests -p 'test_receipt_design_20261013.py' -v
      - name: Official CycloneDX CLI — the four CycloneDX generator fixtures, and the 1.6 and 1.7 exports of every fixture and of the installed floor, must validate
        run: |
          case "$RUNNER_OS" in
            Linux) asset=cyclonedx-linux-x64; sum=bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746;;
            macOS) asset=cyclonedx-osx-arm64; sum=750c148780154833f6401f9067d08c5a4c31567b6ee3c26c062c3a95c62d741c;;
            Windows) asset=cyclonedx-win-x64.exe; sum=9b360974c41a5d612eb026fb5e3bb1fa28e08865f7a4f915665b8bc94bd3bc31;;
          esac
          cli="$RUNNER_TEMP/$asset"
          curl -sSL -o "$cli" "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/$asset"
          python -c "import hashlib, sys; h = hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest(); sys.exit(0 if h == sys.argv[2] else 'sha256 ' + h)" "$cli" "$sum"
          chmod +x "$cli"
          CYCLONEDX="$cli" python - <<'PY'
          import glob, json, os, subprocess, sys
          sys.path.insert(0, ".")
          from omega_cra_evol.sbom import sbom_from_cyclonedx, sbom_from_installed, sbom_from_spdx
          cdx, tmp = os.environ["CYCLONEDX"], os.environ["RUNNER_TEMP"]
          # cdxgen 12.8.4 repeats a bom-ref: not conformant from 0.13.0 (spec/SBOM_INGEST.md, CycloneDX rule 5), read here
          # with allow_nonconformant as in tests/test_sbom_sources.py; this step is about the exports, not about that rule
          allow = lambda p: os.path.basename(p).startswith("cdxgen-12.8.4_")
          recs = [(os.path.basename(p), (sbom_from_spdx if "spdx" in p else sbom_from_cyclonedx)(p, "tiny-cra-sample", "1.0.0", allow_nonconformant=allow(p))) for p in sorted(glob.glob("tests/fixtures/real_tools/*.json"))]
          recs.append(("installed", sbom_from_installed("omega-cra-evol", "0.3.0", ["cryptography"], transitive=True)))
          n = 0
          for p in sorted(glob.glob("tests/fixtures/real_tools/*cyclonedx*.json")):   # the generators' documents themselves
              v = json.load(open(p, encoding="utf-8"))["specVersion"]
              subprocess.run([cdx, "validate", "--input-file", p, "--input-format", "json", "--input-version", "v" + v.replace(".", "_"), "--fail-on-errors"], check=True)
              n += 1
          for name, r in recs:
              for v in ("1.6", "1.7"):
                  out = os.path.join(tmp, f"export_{v}_{name}")
                  with open(out, "w", encoding="utf-8") as f:
                      json.dump(r.to_cyclonedx_min(v), f)
                  subprocess.run([cdx, "validate", "--input-file", out, "--input-format", "json", "--input-version", "v" + v.replace(".", "_"), "--fail-on-errors"], check=True)
                  n += 1
          bad = json.load(open(os.path.join(tmp, "export_1.7_installed"), encoding="utf-8")); bad["components"][0]["type"] = "not-a-type"
          badp = os.path.join(tmp, "bad.json")
          with open(badp, "w", encoding="utf-8") as f:
              json.dump(bad, f)
          assert subprocess.run([cdx, "validate", "--input-file", badp, "--input-format", "json", "--input-version", "v1_7", "--fail-on-errors"]).returncode != 0, "positive control: the CLI must reject a broken document"
          print(f"cyclonedx-cli: {n} exports valid, positive control rejected")
          PY
      - name: Official SPDX tools (pyspdxtools) — the two SPDX generator fixtures must parse with no issue (its exit code is 0 even on an invalid document, so the output is the measure; positive control included)
        run: |
          python -m pip install "spdx-tools==0.8.5"
          for f in tests/fixtures/real_tools/*spdx*.json; do out=$(pyspdxtools -i "$f" 2>&1); if [ -n "$out" ]; then echo "$f: $out"; exit 1; fi; echo "$f: no issue"; done
          echo '{"spdxVersion":"SPDX-2.3"}' > "$RUNNER_TEMP/bad.spdx.json"
          if [ -z "$(pyspdxtools -i "$RUNNER_TEMP/bad.spdx.json" 2>&1)" ]; then echo "positive control: pyspdxtools printed nothing on an invalid document"; exit 1; fi
          echo "pyspdxtools: fixtures clean, positive control reported"

  interop-newest-cryptovalid:
    # README: "a ledger written here verifies unchanged with cryptovalid v0.15.0's reference verifier". The pinned wheel
    # keeps that sentence measurable; this job measures the same ledger against the NEWEST cryptovalid-opencore on the
    # index, so a cryptovalid release that stops accepting our ledgers turns this repository red, not a user's run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: "This package + the newest cryptovalid-opencore from the index (no pin)"
        run: |
          python -m pip install ".[sign,schema]"
          python -m pip install --extra-index-url https://robertolocatelli81-dev.github.io/pypi/ cryptovalid-opencore
          python -c "import importlib.metadata as m; print('cryptovalid-opencore', m.version('cryptovalid-opencore'))"
      - name: "Interop suite against the newest verifier (the test must run, not skip)"
        run: |
          set -e
          python -m unittest -v tests.test_feeds_and_interop
          # the interop test itself must have RUN and PASSED (a skip — cryptovalid missing — is a red): read from the
          # unittest result, not from the printed lines (warnings on stderr split them)
          python - <<'PY'
          import sys, unittest
          name = "tests.test_feeds_and_interop.TestInteropCryptovalid.test_cryptovalid_verifies_our_ledger_and_tip"
          r = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromName(name))
          ok = r.testsRun == 1 and not r.skipped and r.wasSuccessful()
          print("interop test ran and passed" if ok else f"::error::the interop test did not run and pass (run={r.testsRun}, skipped={len(r.skipped)})")
          sys.exit(0 if ok else 1)
          PY
