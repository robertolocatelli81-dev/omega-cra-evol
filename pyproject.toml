[build-system]
requires = ["setuptools>=77"]   # 77: PEP 639 license expression and license-files; bdist_wheel is in setuptools
build-backend = "setuptools.build_meta"

[project]
name = "omega-cra-evol"
version = "0.13.0"
description = "Firm-side, offline-verifiable evidence for the EU Cyber Resilience Act: SBOM records, the Art. 14 clock, SRP-aligned notices, a 10-year crypto-agile seal — in the cryptovalid ledger profile"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Roberto Locatelli"}]
keywords = ["cyber-resilience-act", "CRA", "SBOM", "CycloneDX", "vulnerability-reporting", "ENISA", "evidence", "audit", "hash-chain"]
classifiers = ["Programming Language :: Python :: 3",
               "Topic :: Security", "Intended Audience :: Developers", "Operating System :: OS Independent"]
dependencies = []

[project.optional-dependencies]
sign = ["cryptography>=41"]
schema = ["jsonschema[format-nongpl]>=4.25"]   # 4.25: the first whose [format-nongpl] checks iri-reference (rfc3987-syntax)

[project.scripts]
cra = "omega_cra_evol.cli:main"
omega-cra-evol = "omega_cra_evol.cli:main"

[project.urls]
Homepage = "https://github.com/robertolocatelli81-dev/omega-cra-evol"

[tool.setuptools]
packages = ["omega_cra_evol", "cra_evidence"]   # cra_evidence: the earlier import name, a deprecated alias (removed not before 2027-03-31)

[tool.setuptools.package-data]
omega_cra_evol = ["data/*.json", "data/cyclonedx/*.json", "data/cyclonedx/LICENSE", "data/cyclonedx/SOURCES.txt",
                  "data/spdx/*.json", "data/spdx/LICENSE-*", "data/spdx/SOURCES.txt",
                  "data/openvex/*.json", "data/openvex/LICENSE-*", "data/openvex/SOURCES.txt"]
